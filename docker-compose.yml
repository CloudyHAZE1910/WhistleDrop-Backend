# For local testing only: runs the API with PostgreSQL instead of SQLite,
# which is closer to how a real deployment behaves.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whistledrop
      POSTGRES_USER: whistledrop
      POSTGRES_PASSWORD: localdevpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whistledrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://whistledrop:localdevpassword@db:5432/whistledrop
      WHISTLEDROP_SECRET: change-this-to-a-random-32-plus-character-string
      BOOTSTRAP_MODERATOR_USERNAME: admin
      BOOTSTRAP_MODERATOR_PASSWORD: change-this-password
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
